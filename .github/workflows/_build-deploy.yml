name: Build & Deploy

on:
  workflow_call:
    inputs:
      STAGE:
        description: "The stage to deploy: an environment, or an ephemeral stage name"
        type: string
        required: true
      AWS_REGION:
        description: "The region the deployment role is assumed in"
        type: string
        default: eu-west-2
    secrets:
      ROLE_TO_ASSUME:
        description: "The ARN of the stage's deployment role"
        required: true

jobs:
  buildAndDeploy:
    name: Deploy ${{ inputs.STAGE }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write # to assume the deployment role through OIDC
      contents: read
    environment: ${{ inputs.STAGE }}
    env:
      STAGE: ${{ inputs.STAGE }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.AWS_REGION }}
          role-session-name: ${{ github.run_id }}

      - name: Deploy the platform stacks
        run: pnpm --filter @repo/platform deploy

      - name: Exercise the edge
        run: pnpm --filter @repo/platform test:e2e
