name: Deploy Account

# Deploys one account's stacks in one wave of a stage's deploy, from the cloud assembly the plan
# synthesized, as the account's deploy role.

on:
  workflow_call:
    inputs:
      stage:
        description: "The stage, which is also the GitHub environment holding the account's role"
        required: true
        type: string
      account:
        description: "The account ID"
        required: true
        type: string
      stacks:
        description: "The stacks to deploy, space-separated"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # The deploy role's session lasts as long, from later in the job, so the job never outlives it.
    # A first distribution, certificate and Lambda@Edge function take about half of it.
    timeout-minutes: 60
    environment: ${{ inputs.stage }}
    permissions:
      contents: read
      deployments: read # to find the commit the stage has
      id-token: write # OIDC, to assume the deploy role
    env:
      # The environment holds each account's role as DEPLOY_ROLE_<account ID>.
      ROLE_ARN: ${{ vars[format('DEPLOY_ROLE_{0}', inputs.account)] }}
    steps:
      # Without one, the credentials step would fail with a message that doesn't say which variable
      # is missing.
      - name: Find the account's deploy role
        env:
          ACCOUNT: ${{ inputs.account }}
          STAGE: ${{ inputs.stage }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::The ${STAGE} environment has no DEPLOY_ROLE_${ACCOUNT} variable."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to tell whether the stage's commit is this one's ancestor
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # For the CDK CLI and the check. The assembly deploys as it is, so nothing is built again.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Never deploy a commit older than the stage has (infra/app/src/stage-check.ts). It runs in
      # every job, not once per run, because a job can be run again on its own, reusing an old
      # run's plan, after a newer commit has deployed. It fails rather than skips: a job that
      # skipped would succeed, and record its old commit as the stage's.
      - name: Check the stage has nothing newer
        working-directory: infra/app
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.stage }}
        run: pnpm exec tsx bin/check-stage.ts "$STAGE"

      - name: Download the cloud assembly
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cdk-out-${{ inputs.stage }}
          path: infra/app/cdk.out

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: flex-platform-deploy-${{ github.run_id }}
          # An hour, the most a role allows unless its maximum is raised, and the job's timeout.
          role-duration-seconds: 3600
          # Only for the session. Each stack deploys in the region the assembly names.
          aws-region: eu-west-2

      # --exclusively: without it, cdk deploy also deploys each stack's dependencies, including
      # those in other accounts, which this role can't reach. The plan's waves put them first.
      - name: Deploy
        working-directory: infra/app
        env:
          STACKS: ${{ inputs.stacks }}
        run: |
          read -ra stacks <<< "$STACKS"
          pnpm exec cdk deploy --app cdk.out --exclusively --require-approval never \
            --progress events --concurrency 4 "${stacks[@]}"
