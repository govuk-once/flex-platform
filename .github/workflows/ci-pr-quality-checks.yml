name: Release Candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-checks:
    name: Quality Checks
    uses: ./.github/workflows/_quality-checks.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_URL: ${{ secrets.SONAR_URL }}

  # Codegen compares each version of a gateway's schemas with the one before it, as the files are
  # now. A version edited or removed in place rewrites what the comparison starts from, so a break
  # would pass it; a merged version is history, and only a new one may follow it.
  schema-history:
    name: Schema History
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and the base it was made against
          persist-credentials: false

      - name: Refuse changes to merged schema versions
        run: |
          set -euo pipefail
          # Without rename detection a moved version shows as the removal it is.
          changed=$(git diff --no-renames --name-only --diff-filter=DMT HEAD^1 HEAD \
            -- ':(glob)gateways/**/schemas/[0-9][0-9][0-9][0-9].json')
          if [ -n "$changed" ]; then
            echo "A merged schema version is never changed or removed; add the next version instead:"
            echo "$changed" | sed 's/^/  - /'
            exit 1
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: false
          show-openssf-scorecard: false
