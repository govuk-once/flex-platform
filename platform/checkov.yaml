directory:
  - cdk.out
framework:
  - cloudformation
compact: true
quiet: true
skip-path:
  - cdk.out/asset.*
  - cdk.out/manifest.json
  - cdk.out/tree.json
  - cdk.out/cdk.out
skip-check:
  # CDK's own custom resource providers (cross region references, the zone parameter reader and
  # the ephemeral log bucket's emptier) have no VPC, dead letter queue, concurrency limit or KMS
  # key, and their constructs offer no way to set them.
  - CKV_AWS_115
  - CKV_AWS_116
  - CKV_AWS_117
  - CKV_AWS_173
