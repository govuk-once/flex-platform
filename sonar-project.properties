sonar.organization=govuk-once
sonar.projectKey=govuk-once_flex-platform
sonar.qualitygate.wait=true
sonar.javascript.node.maxspace=8192

sonar.sources=domains, frontdoor, gateways, infra, packages, shared
sonar.exclusions=**/dist/**,**/coverage/**,**/.turbo/**,**/node_modules/**,**/.gen/**,**/cdk.out/**
sonar.tests=domains, frontdoor, gateways, infra, packages, shared
# A package's test/ holds its test helpers and fixtures.
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/__mocks__/**,**/__tests__/**,**/test/**
sonar.typescript.tsconfigPaths=domains/*/tsconfig.json,frontdoor/*/tsconfig.json,gateways/**/tsconfig.json,infra/*/tsconfig.json,packages/*/tsconfig.json,shared/*/tsconfig.json
sonar.javascript.lcov.reportPaths=domains/*/coverage/lcov.info,frontdoor/*/coverage/lcov.info,gateways/**/coverage/lcov.info,infra/*/coverage/lcov.info,packages/*/coverage/lcov.info,shared/*/coverage/lcov.info

# Generated code is produced by codegen and not committed. eslint-config inlines its own Vitest
# config to break a dependency cycle with @repo/vitest-config, so it enables no coverage provider
# and reports no lcov; without this exclusion its lint rules count as uncovered. A gateway's
# config/ holds what its configuration declares, data the libraries' tests cover, and is tested
# no more than gateway.config.ts; a gateway's own handlers live elsewhere and are still counted.
sonar.coverage.exclusions=**/.gen/**,**/*.config.ts,**/bin/**,packages/eslint-config/**,gateways/services/*/config/**

# The stage config is data, written out per environment so each account and zone reads as it is
# deployed. Its repeated shape is the point, not copied code.
sonar.cpd.exclusions=infra/app/src/config/stages.ts

# Rules that don't apply where they're ignored. An entry takes one rule and one path.
sonar.issue.ignore.multicriteria=cdkTests,networkLayout,domainTls,releaseSteps,\
  functionsForOf,functionsAt,functionsNodePrefix,functionsSet,\
  packagesForOf,packagesAt,packagesNodePrefix,packagesSet,\
  frontdoorSharedForOf,frontdoorSharedAt,frontdoorSharedNodePrefix,frontdoorSharedSet

# CDK tests assert with aws-cdk-lib/assertions (`template.hasResourceProperties` and the like),
# which S2699 doesn't recognise as assertions.
sonar.issue.ignore.multicriteria.cdkTests.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.cdkTests.resourceKey=**/infra/**/*.test.ts
# The network's layout is its private address ranges, written out so each subnet's range reads
# as it is deployed.
sonar.issue.ignore.multicriteria.networkLayout.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.networkLayout.resourceKey=infra/constructs/src/network/layout.ts
# A domain's host uses TLS13_1_2_PFS_PQ_2025_09: TLS 1.3, and TLS 1.2 only with forward secrecy.
sonar.issue.ignore.multicriteria.domainTls.ruleKey=typescript:S4423
sonar.issue.ignore.multicriteria.domainTls.resourceKey=domains/infra/src/api-host.ts
# The release tool takes its steps one at a time: builds share the workspace, packages publish
# after what they depend on, and each manifest changed is noted so it can be put back.
sonar.issue.ignore.multicriteria.releaseSteps.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.releaseSteps.resourceKey=packages/release/src/**

# Code bundled into a CloudFront Function runs in cloudfront-js-2.0, which has no for...of
# (S4138), no `at` (S7755), no `node:` module prefix (S7772) and no `Set` (S7776). esbuild can't
# rewrite any of them, and the cloudfrontFunction lint preset refuses all four. Three paths hold
# that code: each function's own, in frontdoor/ and shared/; the two packages every function
# bundles, cloudfront-function and cloudfront-js-utils; and what the Frontdoor's functions share.
sonar.issue.ignore.multicriteria.functionsForOf.ruleKey=typescript:S4138
sonar.issue.ignore.multicriteria.functionsForOf.resourceKey=**/viewer-request/src/function/**
sonar.issue.ignore.multicriteria.functionsAt.ruleKey=typescript:S7755
sonar.issue.ignore.multicriteria.functionsAt.resourceKey=**/viewer-request/src/function/**
sonar.issue.ignore.multicriteria.functionsNodePrefix.ruleKey=typescript:S7772
sonar.issue.ignore.multicriteria.functionsNodePrefix.resourceKey=**/viewer-request/src/function/**
sonar.issue.ignore.multicriteria.functionsSet.ruleKey=typescript:S7776
sonar.issue.ignore.multicriteria.functionsSet.resourceKey=**/viewer-request/src/function/**
sonar.issue.ignore.multicriteria.packagesForOf.ruleKey=typescript:S4138
sonar.issue.ignore.multicriteria.packagesForOf.resourceKey=packages/cloudfront-*/src/**
sonar.issue.ignore.multicriteria.packagesAt.ruleKey=typescript:S7755
sonar.issue.ignore.multicriteria.packagesAt.resourceKey=packages/cloudfront-*/src/**
sonar.issue.ignore.multicriteria.packagesNodePrefix.ruleKey=typescript:S7772
sonar.issue.ignore.multicriteria.packagesNodePrefix.resourceKey=packages/cloudfront-*/src/**
sonar.issue.ignore.multicriteria.packagesSet.ruleKey=typescript:S7776
sonar.issue.ignore.multicriteria.packagesSet.resourceKey=packages/cloudfront-*/src/**
sonar.issue.ignore.multicriteria.frontdoorSharedForOf.ruleKey=typescript:S4138
sonar.issue.ignore.multicriteria.frontdoorSharedForOf.resourceKey=frontdoor/shared/src/**
sonar.issue.ignore.multicriteria.frontdoorSharedAt.ruleKey=typescript:S7755
sonar.issue.ignore.multicriteria.frontdoorSharedAt.resourceKey=frontdoor/shared/src/**
sonar.issue.ignore.multicriteria.frontdoorSharedNodePrefix.ruleKey=typescript:S7772
sonar.issue.ignore.multicriteria.frontdoorSharedNodePrefix.resourceKey=frontdoor/shared/src/**
sonar.issue.ignore.multicriteria.frontdoorSharedSet.ruleKey=typescript:S7776
sonar.issue.ignore.multicriteria.frontdoorSharedSet.resourceKey=frontdoor/shared/src/**
