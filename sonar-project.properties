sonar.organization=govuk-once
sonar.projectKey=govuk-once_flex-platform

sonar.sources=domains, frontdoor, gateways, infra, packages

sonar.tests=domains, frontdoor, gateways, infra, packages
# A package's test/ holds its test helpers and fixtures.
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/__mocks__/**,**/__tests__/**,**/test/**

sonar.qualitygate.wait=true
sonar.typescript.tsconfigPaths=domains/*/tsconfig.json,frontdoor/*/tsconfig.json,gateways/**/tsconfig.json,infra/*/tsconfig.json,packages/*/tsconfig.json
sonar.exclusions=**/dist/**,**/coverage/**,**/.turbo/**,**/node_modules/**,**/.gen/**,**/cdk.out/**

# Generated code is produced by codegen and not committed. eslint-config inlines its own Vitest
# config to break a dependency cycle with @repo/vitest-config, so it enables no coverage provider
# and reports no lcov; without this exclusion its lint rules count as uncovered. A gateway's
# config/ holds what its configuration declares, data the libraries' tests cover, and is tested
# no more than gateway.config.ts; a gateway's own handlers live elsewhere and are still counted.
sonar.coverage.exclusions=**/.gen/**,\
  **/*.config.ts,\
  **/bin/**,\
  packages/eslint-config/**,\
  gateways/services/*/config/**

# The stage config is data, written out per environment so each account and zone reads as it is
# deployed. Its repeated shape is the point, not copied code.
sonar.cpd.exclusions=infra/app/src/config/stages.ts

sonar.javascript.lcov.reportPaths=domains/*/coverage/lcov.info,frontdoor/*/coverage/lcov.info,gateways/**/coverage/lcov.info,infra/*/coverage/lcov.info,packages/*/coverage/lcov.info

sonar.javascript.node.maxspace=8192

# Rules that don't apply where they're ignored:
# - CDK tests assert with aws-cdk-lib/assertions (`template.hasResourceProperties` and the like),
#   which S2699 doesn't recognise as assertions.
# - Code bundled into the CloudFront Function runs in cloudfront-js-2.0, which has no for...of
#   (S4138), no `at` (S7755) and no `node:` module prefix (S7772). esbuild can't rewrite any of
#   them, and the cloudfrontFunction lint preset refuses all three.
# - The network's layout is its private address ranges, written out so each subnet's range
#   reads as it is deployed (S1313).
# - A domain's host uses TLS13_1_2_PFS_PQ_2025_09: TLS 1.3, and TLS 1.2 only with forward secrecy
#   (S4423).
sonar.issue.ignore.multicriteria=cdkTests,cffForOf,cffAt,cffNode,sharedForOf,sharedAt,sharedNode,networkLayout,domainTls
sonar.issue.ignore.multicriteria.cdkTests.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.cdkTests.resourceKey=**/infra/**/*.test.ts
sonar.issue.ignore.multicriteria.cffForOf.ruleKey=typescript:S4138
sonar.issue.ignore.multicriteria.cffForOf.resourceKey=frontdoor/viewer-request/src/function/**
sonar.issue.ignore.multicriteria.cffAt.ruleKey=typescript:S7755
sonar.issue.ignore.multicriteria.cffAt.resourceKey=frontdoor/viewer-request/src/function/**
sonar.issue.ignore.multicriteria.cffNode.ruleKey=typescript:S7772
sonar.issue.ignore.multicriteria.cffNode.resourceKey=frontdoor/viewer-request/src/function/**
sonar.issue.ignore.multicriteria.sharedForOf.ruleKey=typescript:S4138
sonar.issue.ignore.multicriteria.sharedForOf.resourceKey=frontdoor/shared/src/**
sonar.issue.ignore.multicriteria.sharedAt.ruleKey=typescript:S7755
sonar.issue.ignore.multicriteria.sharedAt.resourceKey=frontdoor/shared/src/**
sonar.issue.ignore.multicriteria.sharedNode.ruleKey=typescript:S7772
sonar.issue.ignore.multicriteria.sharedNode.resourceKey=frontdoor/shared/src/**
sonar.issue.ignore.multicriteria.networkLayout.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.networkLayout.resourceKey=infra/constructs/src/network/layout.ts
sonar.issue.ignore.multicriteria.domainTls.ruleKey=typescript:S4423
sonar.issue.ignore.multicriteria.domainTls.resourceKey=domains/infra/src/api-host.ts
